; DIY ESP32-S3 E-Ink node. Copy this folder into meshtastic/firmware/variants/
; STARTING POINT: copy lib_deps and any extra build_flags from the current
; [env:heltec-wireless-paper] upstream so the e-paper driver matches. Check upstream.
[env:diy-s3-eink]
extends = esp32s3_base
board = esp32-s3-devkitc-1
board_level = extra
build_flags =
  ${esp32s3_base.build_flags}
  -I variants/diy_s3_eink
  -D DIY_S3_EINK
  -D EINK_DISPLAY_MODEL=GxEPD2_213_BN   ; 2.13" B/W 250x122. For 2.9" use GxEPD2_290_BS and 296x128
  -D EINK_WIDTH=250
  -D EINK_HEIGHT=122
lib_deps =
  ${esp32s3_base.lib_deps}
  ; + the GxEPD2 dependency used by env:heltec-wireless-paper upstream

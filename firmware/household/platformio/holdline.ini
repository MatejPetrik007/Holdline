; Holdline build environments. Copied to variants/esp32s3/holdline/platformio.ini by
; apply-overlay.sh; upstream's platformio.ini picks it up through extra_configs.
; SPDX-License-Identifier: GPL-3.0-only
;
; One image per board serves households and relay routers: the role comes from the
; provisioning bundle. HOLDLINE_VERSION comes from the environment (build.sh / CI).

[holdline]
build_flags =
  -D HOLDLINE=1
  -D HOLDLINE_VERSION=\"${sysenv.HOLDLINE_VERSION}\"
  -D OLED_CS                ; selects the Windows-1250 InkHUD fonts: Czech and Polish
  -I third_party
  -I src/modules/optional/Holdline/core/backend
  ; Defence in depth on top of the send-path filter (SPEC 5.2): do not even build these.
  -D MESHTASTIC_EXCLUDE_WIFI=1
  -D MESHTASTIC_EXCLUDE_WEBSERVER=1
  -D MESHTASTIC_EXCLUDE_MQTT=1
  -D MESHTASTIC_EXCLUDE_STOREFORWARD=1
  -D MESHTASTIC_EXCLUDE_PAXCOUNTER=1
  -D MESHTASTIC_EXCLUDE_AUDIO=1
  -D MESHTASTIC_EXCLUDE_DETECTIONSENSOR=1
  -D MESHTASTIC_EXCLUDE_GPS=1

[env:holdline-heltec-wireless-paper]
extends = env:heltec-wireless-paper-inkhud
build_flags =
  ${env:heltec-wireless-paper-inkhud.build_flags}
  ${holdline.build_flags}
  -D HOLDLINE_BOARD=\"heltec-wireless-paper\"
  -D HOLDLINE_VIBRA_PIN=21  ; hardware/addons/README.md: vibration motor
  -D HOLDLINE_BAND_TX=15    ; haptic band Pro
  -D HOLDLINE_BAND_RX=16

[env:holdline-heltec-vision-master-e213]
extends = env:heltec-vision-master-e213-inkhud
build_flags =
  ${env:heltec-vision-master-e213-inkhud.build_flags}
  ${holdline.build_flags}
  -D HOLDLINE_BOARD=\"heltec-vision-master-e213\"

[env:holdline-heltec-vision-master-e290]
extends = env:heltec-vision-master-e290-inkhud
build_flags =
  ${env:heltec-vision-master-e290-inkhud.build_flags}
  ${holdline.build_flags}
  -D HOLDLINE_BOARD=\"heltec-vision-master-e290\"

[env:holdline-lilygo-t5-s3-epaper]
extends = env:t5s3_epaper_inkhud
build_flags =
  ${env:t5s3_epaper_inkhud.build_flags}
  ${holdline.build_flags}
  -D HOLDLINE_BOARD=\"lilygo-t5-s3-epaper\"

; DIY board: ESP32-S3-DevKitC-1 + SX1262 + 2.13" SPI e-paper. Same pin map as the Heltec
; Wireless Paper, plus the add-on pins of site/pins.js. NOT YET TESTED ON HARDWARE.
[env:holdline-diy-s3-eink]
extends = esp32s3_base, inkhud
board = esp32-s3-devkitc-1
board_level = extra
board_build.partitions = default_8MB.csv
build_src_filter =
  ${esp32s3_base.build_src_filter}
  ${inkhud.build_src_filter}
build_flags =
  ${esp32s3_base.build_flags}
  ${inkhud.build_flags}
  ${holdline.build_flags}
  -I variants/esp32s3/holdline_diy_s3_eink
  -D PRIVATE_HW
  -D HOLDLINE_BOARD=\"diy-s3-eink\"
  -D HOLDLINE_VIBRA_PIN=21
  -D HOLDLINE_BAND_TX=15
  -D HOLDLINE_BAND_RX=16
lib_deps =
  ${inkhud.lib_deps}
  ${esp32s3_base.lib_deps}
upload_speed = 921600
